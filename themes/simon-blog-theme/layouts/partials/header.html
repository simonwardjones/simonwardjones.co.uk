<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand text-blue" href="/">SW-J</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
    aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavDropdown">
    <ul class="navbar-nav mr-auto">
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
      {{ if .HasChildren }}
      <li
        class="nav-item dropdown {{if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{end}}">
        <a class="nav-link dropdown-toggle" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true"
          aria-expanded="false">
          {{ .Name }}
        </a>
        <div class="dropdown-menu " aria-labelledby="navbarDropdownMenuLink">
          {{ range sort .Children ".Page.Date" "desc" }}
          <a class="dropdown-item {{if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{end}}"
            href="{{.URL}}">{{ .Name }}</a>
          {{ end }}
          <div class="dropdown-divider"></div>
          <a class="dropdown-item text-primary" href="{{.URL}}">See all</a>
        </div>

      </li>
      {{ else }}
      <li
        class="nav-item {{if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}active{{end}}">
        <a class="nav-link" href="{{.URL}}">{{ .Name }}<span class="sr-only">(current)</span></a>
      </li>
      {{ end }}
      {{ end }}
    </ul>
    <button id="theme-toggle" type="button" class="theme-switch" role="switch" aria-checked="false"
      aria-label="Toggle dark mode">
      <svg class="theme-switch-track-icon theme-switch-track-icon--sun" width="12" height="12" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
        </path>
      </svg>
      <svg class="theme-switch-track-icon theme-switch-track-icon--moon" width="12" height="12" viewBox="0 0 24 24"
        fill="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span class="theme-switch-thumb"></span>
    </button>
  </div>
</nav>
