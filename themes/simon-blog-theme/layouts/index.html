{{ define "title"}}{{ .Site.Title}}{{ end }}

{{ define "main" }}
<main aria-role="main">

    <header class="homepage-header">
        <section class="jumbotron text-center">
            <h1 class="name">{{.Title}}</h1>
            {{ with .Params.subtitle }}
            <p class="subtitle">{{.}}</p>
            {{ end }}
            <div class="hero-actions">
                <a href="/posts" class="btn btn-primary">View my posts</a>
                <a href="/contact" class="btn btn-outline-primary">Get in touch</a>
            </div>
        </section>
    </header>

    <div class="homepage-content">
        <div class="container">

            <div class="row">
                <div class="col">
                    {{.Content}}
                </div>
            </div>

            <h4 class="title mt-5">My latest posts</h4>
            <div class="row">
                {{ range first 6 (where .Site.RegularPages "Section" "posts") }}
                {{ .Render "summary"}}
                {{ end }}
            </div>

        </div>
    </div>

</main>
{{ end }}
